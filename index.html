<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VITAL-SYNC</title>
  <style>
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
      box-sizing: border-box;
      background: #020617;
      color: #f8fafc;
      font-family: 'Noto Sans TC', system-ui, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 360px;
      padding: 28px 24px;
      border-radius: 24px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0.2em; color: #38bdf8; }
    #account { width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .who { display: flex; align-items: center; gap: 12px; }
    .who img { width: 44px; height: 44px; border-radius: 50%; }
    .muted { color: #94a3b8; font-size: 13px; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.85);
      font-size: 14px;
    }
    .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; }
    .chip-none { color: #94a3b8; }
    .chip-granted { color: #34d399; }
    .chip-expired { color: #f59e0b; }
    button {
      font: inherit;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
    }
    #authorize { background: #0284c7; color: #fff; font-weight: 700; }
    #signout { background: none; color: #64748b; padding: 4px; font-size: 13px; }
    #error { margin: 0; color: #fca5a5; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <h1>VITAL-SYNC</h1>

    <div id="signin-button"></div>

    <section id="account" hidden>
      <div class="who">
        <img id="avatar" alt="" referrerpolicy="no-referrer">
        <div>
          <div id="name"></div>
          <div id="email" class="muted"></div>
        </div>
      </div>
      <div class="row">
        <span>試算表</span>
        <span id="sheets-status" class="chip"></span>
      </div>
      <button id="authorize" type="button">允許存取試算表</button>
      <button id="signout" type="button">登出</button>
    </section>

    <p id="error" role="alert" hidden></p>
  </main>

  <script>
    const CLIENT_ID = '959499500594-srq9p0eqltr58f7th3mpd59h5bb1qvee.apps.googleusercontent.com';
    const SHEETS_SCOPE = 'https://www.googleapis.com/auth/spreadsheets';

    const TOKEN_ERROR_MESSAGES = {
      popup_closed: '授權視窗被關掉了，再按一次「允許存取試算表」',
      popup_failed_to_open: '授權視窗被瀏覽器擋下，請允許這個網站開彈出視窗後再試',
    };
    const DEFAULT_TOKEN_ERROR = '授權沒有完成，再按一次「允許存取試算表」';

    const STATUS_VIEW = {
      none: { cls: 'chip-none', text: () => '未授權' },
      granted: { cls: 'chip-granted', text: () => '✓ 有效至 ' + formatTime(state.tokenExpiresAt) },
      expired: { cls: 'chip-expired', text: () => '已過期' },
    };

    const $ = (id) => document.getElementById(id);
    const state = { user: null, token: null, tokenExpiresAt: 0 };
    let tokenClient = null;
    let expiryTimer = null;

    function onGisLoaded() {
      google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential });
      google.accounts.id.renderButton($('signin-button'), {
        theme: 'filled_black',
        size: 'large',
        shape: 'pill',
        locale: 'zh-TW',
      });
      render();
    }

    function onGisFailed() {
      showError('Google 登入元件載入失敗，請檢查網路後重新整理');
    }

    // ID token 只拿來顯示是誰登入；能不能讀寫試算表由 Google 驗 access token 決定，所以這裡不驗簽章
    function decodeJwtPayload(jwt) {
      const base64 = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function onCredential({ credential }) {
      const { email, name, picture } = decodeJwtPayload(credential);
      state.user = { email, name, picture };
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SHEETS_SCOPE,
        login_hint: email,
        callback: onTokenResponse,
        error_callback: (err) => showError(TOKEN_ERROR_MESSAGES[err.type] || DEFAULT_TOKEN_ERROR),
      });
      clearError();
      render();
    }

    function requestToken() {
      // prompt 空字串：同意過就不再跳同意畫面，彈窗會自己關掉
      tokenClient.requestAccessToken({ prompt: '' });
    }

    function onTokenResponse(response) {
      if (response.error) return showError(DEFAULT_TOKEN_ERROR);
      // 使用者可以在同意畫面把試算表那格取消勾選，這時拿到的 token 沒有試算表權限
      if (!google.accounts.oauth2.hasGrantedAllScopes(response, SHEETS_SCOPE)) {
        return showError('試算表權限沒有勾選，再授權一次並勾選它');
      }
      state.token = response.access_token;
      state.tokenExpiresAt = Date.now() + Number(response.expires_in) * 1000;
      clearTimeout(expiryTimer);
      expiryTimer = setTimeout(render, state.tokenExpiresAt - Date.now());
      clearError();
      render();
    }

    function signOut() {
      google.accounts.id.disableAutoSelect();
      clearTimeout(expiryTimer);
      state.user = null;
      state.token = null;
      state.tokenExpiresAt = 0;
      tokenClient = null;
      clearError();
      render();
    }

    function tokenStatus() {
      if (!state.token) return 'none';
      return Date.now() < state.tokenExpiresAt ? 'granted' : 'expired';
    }

    function formatTime(ms) {
      return new Date(ms).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function render() {
      const signedIn = state.user !== null;
      $('signin-button').hidden = signedIn;
      $('account').hidden = !signedIn;
      if (!signedIn) return;

      $('avatar').src = state.user.picture || '';
      $('avatar').hidden = !state.user.picture;
      $('name').textContent = state.user.name || '';
      $('email').textContent = state.user.email;

      const status = tokenStatus();
      const view = STATUS_VIEW[status];
      $('sheets-status').className = 'chip ' + view.cls;
      $('sheets-status').textContent = view.text();
      $('authorize').hidden = status === 'granted';
    }

    function showError(message) {
      $('error').textContent = message;
      $('error').hidden = false;
    }

    function clearError() {
      $('error').hidden = true;
    }

    $('authorize').addEventListener('click', requestToken);
    $('signout').addEventListener('click', signOut);
  </script>
  <script src="https://accounts.google.com/gsi/client" async onload="onGisLoaded()" onerror="onGisFailed()"></script>
</body>
</html>
