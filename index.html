<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VITAL-SYNC</title>
  <style>
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
      box-sizing: border-box;
      background: #020617;
      color: #f8fafc;
      font-family: 'Noto Sans TC', system-ui, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 360px;
      padding: 28px 24px;
      border-radius: 24px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0.2em; color: #38bdf8; }
    #account { width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .who { display: flex; align-items: center; gap: 12px; }
    .who img { width: 44px; height: 44px; border-radius: 50%; }
    .muted { color: #94a3b8; font-size: 13px; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.85);
      font-size: 14px;
    }
    .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; }
    .chip-none { color: #94a3b8; }
    .chip-granted { color: #34d399; }
    .chip-expired { color: #f59e0b; }
    button {
      font: inherit;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
    }
    #authorize { background: #0284c7; color: #fff; font-weight: 700; }
    #signout { background: none; color: #64748b; padding: 4px; font-size: 13px; }
    #spreadsheet-link { color: #34d399; text-decoration: none; font-weight: 700; }
    #spreadsheet-retry { background: none; color: #f59e0b; border: 1px solid currentColor; padding: 3px 10px; font-size: 12px; border-radius: 999px; }
    #spreadsheet-note { margin: -8px 0 0; text-align: center; }
    #error { margin: 0; color: #fca5a5; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <h1>VITAL-SYNC</h1>

    <div id="signin-button"></div>

    <section id="account" hidden>
      <div class="who">
        <img id="avatar" alt="" referrerpolicy="no-referrer">
        <div>
          <div id="name"></div>
          <div id="email" class="muted"></div>
        </div>
      </div>
      <div class="row">
        <span>存取權限</span>
        <span id="sheets-status" class="chip"></span>
      </div>
      <button id="authorize" type="button">允許存取試算表</button>
      <div id="spreadsheet-row" class="row" hidden>
        <span>我的試算表</span>
        <span id="spreadsheet-loading" class="muted">準備中…</span>
        <a id="spreadsheet-link" target="_blank" rel="noopener" hidden>開啟 ↗</a>
        <button id="spreadsheet-retry" type="button" hidden>重試</button>
      </div>
      <p id="spreadsheet-note" class="muted" hidden>已在你的雲端硬碟建立「VITAL-SYNC」試算表</p>
      <button id="signout" type="button">登出</button>
    </section>

    <p id="error" role="alert" hidden></p>
  </main>

  <script src="./google.js"></script>
  <script src="https://accounts.google.com/gsi/client" async onload="onGisLoaded()" onerror="onGisFailed()"></script>
</body>
</html>
